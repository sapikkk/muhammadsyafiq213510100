name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm clean-install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:audit-env
      - run: npm run check:banned-ui
      - run: npm run check:legacy-api-json
      - run: npm run check:production-env
      - name: Semgrep (keamanan statis)
        run: |
          python3 -m pip install semgrep
          npm run semgrep:scan
      - run: npm run build
