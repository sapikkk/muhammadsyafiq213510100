name: e2e

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kokonus_farm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kokonus_farm
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/kokonus_farm
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-e2e-nextauth-secret-not-for-production
      E2E_PASSWORD: KokonusDemo2026
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm clean-install
      - run: npx prisma db push --accept-data-loss
      - name: Env file for prisma seed
        run: |
          printf 'DATABASE_URL=%s\nDIRECT_URL=%s\n' "$DATABASE_URL" "$DIRECT_URL" > .env
      - run: npx prisma db seed
      - run: npm run check:jurnal-balance
      - name: ID siklus demo untuk Playwright
        run: echo "E2E_DEMO_SIKLUS_ID=$(node scripts/reset-e2e-siklus.js)" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
